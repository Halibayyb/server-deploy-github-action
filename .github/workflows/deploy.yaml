name: Deploy via SCP Docker Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: test-deploy
      REMOTE_DIR: /home/deploy/app/docker

    steps:
      # 1. Checkout branch
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest .

      # 3. Save image
      - name: Export Docker image
        run: |
          docker save $IMAGE_NAME:latest | gzip > $IMAGE_NAME.tar.gz

      # 4. Copy to server
      - name: SCP to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "${{ env.IMAGE_NAME }}.tar.gz"
          target: "${{ env.REMOTE_DIR }}"

      # 5. SSH to deploy
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd ${{ env.REMOTE_DIR }}

            echo "📦 Load Docker image"
            docker load < ${{ env.IMAGE_NAME }}.tar.gz

            echo "🧹 Remove tar file"
            rm ${{ env.IMAGE_NAME }}.tar.gz

            echo "🚀 Start services"
            docker compose up ${{ env.IMAGE_NAME }} -d --force-recreate

            echo "✅ Deploy success"
